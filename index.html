<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Elevate Deal Room — Accès privé aux opportunités immobilières du portefeuille Elevate." />
<title>Elevate Deal Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --cream: #F4F0E6;
  --cream-deep: #EBE4D2;
  --paper: #FBF8F0;
  --ink: #0E0C08;
  --ink-soft: #2A251E;
  --muted: #6A6157;
  --line: #D8CFB8;
  --line-soft: #E8E0CC;
  --accent: #6B2737;
  --accent-soft: #8B3A4A;
  --gold: #B89968;
  --gold-soft: #D4B785;
  --success: #2D5A3D;
  --danger: #8B1A1A;

  --font-display: 'Fraunces', 'Times New Roman', serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
img { max-width: 100%; display: block; }

/* TYPOGRAPHY */
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.02em; line-height: 1; font-variation-settings: "opsz" 144; }
.display-italic { font-style: italic; font-variation-settings: "opsz" 144; }
.mono { font-family: var(--font-mono); font-feature-settings: "ss01", "ss02"; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
.label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }

/* LAYOUT */
.container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
.container-tight { max-width: 880px; margin: 0 auto; padding: 0 32px; }
.container-narrow { max-width: 640px; margin: 0 auto; padding: 0 32px; }

/* TOP BAR */
.topbar { border-bottom: 1px solid var(--line); background: var(--cream); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 28px; height: 28px; background: var(--ink); color: var(--cream); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.brand-name { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -0.01em; }
.brand-name .small { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; font-family: var(--font-mono); color: var(--muted); display: block; margin-top: 2px; font-weight: 500; }
.topbar-nav { display: flex; gap: 28px; align-items: center; }
.topbar-nav a { font-size: 13px; color: var(--ink-soft); transition: color 0.2s; }
.topbar-nav a:hover { color: var(--accent); }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 24px; font-size: 13px; font-weight: 500; letter-spacing: 0.02em; transition: all 0.2s ease; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--ink); color: var(--cream); }
.btn-primary:hover { background: var(--accent); }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-secondary:hover { background: var(--ink); color: var(--cream); }
.btn-ghost { background: transparent; color: var(--ink-soft); }
.btn-ghost:hover { color: var(--ink); }
.btn-sm { padding: 9px 16px; font-size: 12px; }
.btn-lg { padding: 18px 32px; font-size: 14px; }
.btn-block { display: flex; width: 100%; justify-content: center; }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: var(--cream); }
.btn-success { background: var(--success); color: var(--cream); }
.btn-success:hover { background: #1f4029; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }

/* HERO LANDING */
.hero { padding: 96px 0 80px; border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.hero-eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
.hero-eyebrow .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.hero h1 { font-family: var(--font-display); font-weight: 350; font-size: clamp(48px, 7vw, 88px); line-height: 0.95; letter-spacing: -0.035em; margin-bottom: 32px; }
.hero h1 em { font-style: italic; font-weight: 350; color: var(--accent); }
.hero p.lede { font-size: 17px; line-height: 1.55; color: var(--ink-soft); margin-bottom: 40px; max-width: 480px; }
.hero-meta { display: flex; gap: 32px; padding-top: 32px; border-top: 1px solid var(--line); }
.hero-meta div { font-size: 12px; color: var(--muted); }
.hero-meta strong { display: block; font-family: var(--font-mono); font-size: 13px; color: var(--ink); margin-bottom: 4px; }

.hero-card { background: var(--paper); border: 1px solid var(--line); padding: 40px; position: relative; }
.hero-card::before { content: ''; position: absolute; top: -1px; left: -1px; width: 24px; height: 24px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
.hero-card::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 24px; height: 24px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
.hero-card h3 { font-family: var(--font-display); font-size: 24px; font-weight: 400; margin-bottom: 8px; }
.hero-card p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.hero-card .key { display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
.hero-card .key:first-of-type { border-top: 0; }
.hero-card .key span:first-child { color: var(--muted); }
.hero-card .key span:last-child { font-family: var(--font-mono); font-weight: 500; }
.hero-card .locked { margin-top: 20px; padding: 16px; background: var(--cream-deep); display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-soft); }
.hero-card .locked svg { flex-shrink: 0; }

/* SECTIONS */
.section { padding: 96px 0; border-bottom: 1px solid var(--line); }
.section-head { display: flex; align-items: baseline; gap: 32px; margin-bottom: 64px; }
.section-num { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.15em; color: var(--accent); padding-top: 8px; }
.section-title { font-family: var(--font-display); font-size: clamp(36px, 5vw, 56px); font-weight: 350; line-height: 1.02; letter-spacing: -0.025em; flex: 1; max-width: 800px; }
.section-title em { font-style: italic; color: var(--accent); }

/* PROCESS STEPS */
.process { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.process-step { background: var(--cream); padding: 40px 32px 48px; position: relative; }
.process-step .step-num { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 24px; }
.process-step h3 { font-family: var(--font-display); font-size: 28px; font-weight: 400; margin-bottom: 12px; letter-spacing: -0.02em; }
.process-step h3 em { font-style: italic; color: var(--accent); }
.process-step p { font-size: 14px; color: var(--ink-soft); line-height: 1.6; }

/* FOOTER */
.footer { background: var(--ink); color: var(--cream); padding: 64px 0 32px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; margin-bottom: 48px; }
.footer h4 { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; font-weight: 500; }
.footer ul { list-style: none; }
.footer ul li { font-size: 13px; color: rgba(244, 240, 230, 0.7); margin-bottom: 8px; }
.footer ul li a:hover { color: var(--gold); }
.footer-brand { font-family: var(--font-display); font-size: 32px; font-weight: 400; margin-bottom: 16px; letter-spacing: -0.02em; }
.footer-tag { font-size: 13px; color: rgba(244, 240, 230, 0.6); max-width: 320px; line-height: 1.6; }
.footer-bottom { border-top: 1px solid rgba(244, 240, 230, 0.15); padding-top: 24px; display: flex; justify-content: space-between; font-size: 11px; color: rgba(244, 240, 230, 0.5); font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }
.footer-bottom a:hover { color: var(--gold); }

/* ===== ADMIN ===== */
body.dark-mode { background: var(--ink); color: var(--cream); }
body.dark-mode .topbar { background: var(--ink); border-color: rgba(244, 240, 230, 0.12); }
body.dark-mode .topbar-nav a { color: rgba(244, 240, 230, 0.7); }
body.dark-mode .topbar-nav a:hover { color: var(--gold); }
body.dark-mode .brand-mark { background: var(--gold); color: var(--ink); }
body.dark-mode .brand-name .small { color: rgba(244, 240, 230, 0.5); }
body.dark-mode .btn-primary { background: var(--gold); color: var(--ink); }
body.dark-mode .btn-primary:hover { background: var(--gold-soft); }
body.dark-mode .btn-secondary { color: var(--cream); border-color: rgba(244, 240, 230, 0.3); }
body.dark-mode .btn-secondary:hover { background: var(--cream); color: var(--ink); }
body.dark-mode .btn-ghost { color: rgba(244, 240, 230, 0.7); }
body.dark-mode .btn-ghost:hover { color: var(--gold); }

.admin-wrap { padding: 48px 0 96px; min-height: calc(100vh - 64px); }
.admin-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 48px; padding-bottom: 24px; border-bottom: 1px solid rgba(244, 240, 230, 0.12); }
.admin-head h1 { font-family: var(--font-display); font-size: 48px; font-weight: 350; letter-spacing: -0.025em; }
.admin-head p { font-size: 13px; color: rgba(244, 240, 230, 0.6); margin-top: 8px; }
.admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 48px; border: 1px solid rgba(244, 240, 230, 0.12); }
.admin-stat { padding: 24px 28px; border-right: 1px solid rgba(244, 240, 230, 0.12); }
.admin-stat:last-child { border-right: 0; }
.admin-stat .num { font-family: var(--font-display); font-size: 36px; font-weight: 400; letter-spacing: -0.02em; line-height: 1; margin-bottom: 8px; }
.admin-stat .num em { font-style: italic; color: var(--gold); }
.admin-stat .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(244, 240, 230, 0.5); }

/* DEAL LIST */
.deals-list { border: 1px solid rgba(244, 240, 230, 0.12); }
.deals-list-head { display: grid; grid-template-columns: 80px 2fr 1fr 1fr 1fr 120px; padding: 16px 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(244, 240, 230, 0.5); border-bottom: 1px solid rgba(244, 240, 230, 0.12); }
.deal-row { display: grid; grid-template-columns: 80px 2fr 1fr 1fr 1fr 120px; padding: 20px 24px; border-bottom: 1px solid rgba(244, 240, 230, 0.08); align-items: center; transition: background 0.15s; }
.deal-row:last-child { border-bottom: 0; }
.deal-row:hover { background: rgba(244, 240, 230, 0.03); }
.deal-row .deal-num { font-family: var(--font-mono); font-size: 12px; color: var(--gold); }
.deal-row .deal-title { font-family: var(--font-display); font-size: 18px; font-weight: 400; }
.deal-row .deal-meta { font-size: 12px; color: rgba(244, 240, 230, 0.7); margin-top: 2px; }
.deal-row .deal-price { font-family: var(--font-mono); font-size: 14px; }
.deal-row .deal-cap { font-family: var(--font-mono); font-size: 13px; color: rgba(244, 240, 230, 0.7); }
.deal-row .deal-sigs { font-family: var(--font-mono); font-size: 13px; }
.deal-row .deal-sigs strong { color: var(--gold); font-weight: 500; }
.deal-row .deal-actions { display: flex; gap: 6px; justify-content: flex-end; }
.deal-row .icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: rgba(244, 240, 230, 0.6); border: 1px solid rgba(244, 240, 230, 0.15); transition: all 0.15s; }
.deal-row .icon-btn:hover { color: var(--gold); border-color: var(--gold); }

.empty-state { padding: 96px 32px; text-align: center; border: 1px dashed rgba(244, 240, 230, 0.2); }
.empty-state h3 { font-family: var(--font-display); font-size: 28px; font-weight: 350; margin-bottom: 12px; }
.empty-state p { color: rgba(244, 240, 230, 0.5); font-size: 14px; margin-bottom: 24px; }

/* MODAL / WIZARD */
.modal-backdrop { position: fixed; inset: 0; background: rgba(14, 12, 8, 0.7); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 48px 24px; overflow-y: auto; }
.modal { background: var(--cream); color: var(--ink); width: 100%; max-width: 720px; position: relative; }
.modal-head { padding: 32px 40px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.modal-head h2 { font-family: var(--font-display); font-size: 28px; font-weight: 400; letter-spacing: -0.02em; }
.modal-head .modal-step { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.modal-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: color 0.15s; }
.modal-close:hover { color: var(--ink); }
.modal-body { padding: 32px 40px; }
.modal-foot { padding: 24px 40px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--paper); }

.modal-progress { display: flex; gap: 4px; margin-bottom: 32px; }
.modal-progress span { height: 2px; flex: 1; background: var(--line); transition: background 0.3s; }
.modal-progress span.active { background: var(--accent); }
.modal-progress span.done { background: var(--ink); }

.step-intro { margin-bottom: 28px; }
.step-intro .eyebrow { margin-bottom: 8px; }
.step-intro h3 { font-family: var(--font-display); font-size: 22px; font-weight: 400; margin-bottom: 6px; letter-spacing: -0.015em; }
.step-intro p { font-size: 13px; color: var(--muted); }

/* FORM CONTROLS */
.field { margin-bottom: 20px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.field label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; font-weight: 500; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 6px; font-family: var(--font-body); }
.field input[type="text"], .field input[type="number"], .field input[type="email"], .field input[type="tel"], .field input[type="date"], .field textarea, .field select { width: 100%; background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; font-size: 14px; transition: border-color 0.15s; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--ink); }
.field textarea { min-height: 100px; resize: vertical; line-height: 1.5; font-family: var(--font-body); }
.field input.mono, .field textarea.mono { font-family: var(--font-mono); }
.field .input-prefix { position: relative; }
.field .input-prefix span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 13px; color: var(--muted); pointer-events: none; }
.field .input-prefix input { padding-left: 32px; font-family: var(--font-mono); }
.field .input-suffix { position: relative; }
.field .input-suffix span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 12px; color: var(--muted); pointer-events: none; }

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border: 1px solid var(--line); background: var(--paper); font-size: 12px; cursor: pointer; transition: all 0.15s; font-family: var(--font-mono); letter-spacing: 0.04em; }
.chip:hover { border-color: var(--ink); }
.chip.selected { background: var(--ink); color: var(--cream); border-color: var(--ink); }

.docs-list { background: var(--paper); border: 1px solid var(--line); padding: 12px; }
.docs-item { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
.docs-item input { flex: 1; background: var(--cream); border: 1px solid var(--line); padding: 10px 12px; font-size: 13px; }
.docs-item button { color: var(--muted); padding: 6px; }
.docs-item button:hover { color: var(--danger); }
.docs-add { width: 100%; padding: 10px; border: 1px dashed var(--line); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 8px; transition: all 0.15s; }
.docs-add:hover { color: var(--ink); border-color: var(--ink); border-style: solid; }

/* SUCCESS / SHARE STEP */
.share-card { background: var(--paper); border: 1px solid var(--line); padding: 32px; text-align: center; margin-bottom: 24px; }
.share-card .icon { width: 48px; height: 48px; background: var(--success); color: var(--cream); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.share-card h3 { font-family: var(--font-display); font-size: 28px; font-weight: 400; margin-bottom: 8px; letter-spacing: -0.02em; }
.share-card p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

.link-display { display: flex; align-items: center; background: var(--cream-deep); border: 1px solid var(--line); padding: 4px; margin-bottom: 16px; }
.link-display .url { flex: 1; font-family: var(--font-mono); font-size: 12px; padding: 12px 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); }
.link-display button { background: var(--ink); color: var(--cream); padding: 10px 18px; font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }
.link-display button:hover { background: var(--accent); }
.link-display button.copied { background: var(--success); }

.share-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ===== DEAL VIEW (public) ===== */
.deal-page { background: var(--cream); min-height: 100vh; }
.deal-hero { padding: 64px 0 48px; border-bottom: 1px solid var(--line); }
.deal-hero .label { margin-bottom: 16px; }
.deal-hero h1 { font-family: var(--font-display); font-size: clamp(40px, 6vw, 72px); font-weight: 350; line-height: 1; letter-spacing: -0.03em; margin-bottom: 16px; }
.deal-hero h1 em { font-style: italic; color: var(--accent); }
.deal-hero .deal-sub { font-size: 17px; color: var(--ink-soft); max-width: 640px; line-height: 1.5; }

/* NDA STEP */
.nda-section { padding: 64px 0; }
.nda-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 64px; align-items: flex-start; }

.nda-document { background: var(--paper); border: 1px solid var(--line); padding: 48px; max-height: 70vh; overflow-y: auto; position: relative; }
.nda-document::before { content: 'CONFIDENTIEL'; position: absolute; top: 12px; right: 16px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em; color: var(--accent); }
.nda-document h2 { font-family: var(--font-display); font-size: 24px; font-weight: 400; margin-bottom: 4px; letter-spacing: -0.015em; }
.nda-document .doc-meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--line); letter-spacing: 0.08em; }
.nda-document h3 { font-family: var(--font-display); font-size: 16px; font-weight: 500; margin-top: 24px; margin-bottom: 10px; letter-spacing: -0.01em; }
.nda-document p { font-size: 13px; line-height: 1.65; color: var(--ink-soft); margin-bottom: 12px; }
.nda-document ol, .nda-document ul { padding-left: 20px; margin-bottom: 12px; }
.nda-document li { font-size: 13px; line-height: 1.65; color: var(--ink-soft); margin-bottom: 8px; }
.nda-document strong { font-weight: 600; color: var(--ink); }

.nda-form { position: sticky; top: 96px; }
.nda-form h2 { font-family: var(--font-display); font-size: 26px; font-weight: 400; margin-bottom: 8px; letter-spacing: -0.015em; }
.nda-form .form-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.55; }

.signature-pad-wrap { border: 1px solid var(--line); background: var(--paper); position: relative; }
.signature-pad { width: 100%; height: 160px; cursor: crosshair; display: block; touch-action: none; }
.signature-pad-wrap .clear-sig { position: absolute; top: 8px; right: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 4px 8px; }
.signature-pad-wrap .clear-sig:hover { color: var(--danger); }

<script>
// ============ STATE & UTILITIES ============
const STORAGE_KEY_DEALS = 'elevate_dealroom_deals_v1';
const STORAGE_KEY_AUTH = 'elevate_dealroom_auth_v1';
const STORAGE_KEY_SIGS_PREFIX = 'elevate_dealroom_sigs_';
const STORAGE_KEY_SIGNED_PREFIX = 'elevate_dealroom_signed_';

// =============================================
// CONFIG SUPABASE — PHASE 5 (Backend)
// =============================================
const SUPABASE_URL = 'https://uqyknvkxrymldwnbrftw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxeWtudmt4cnltbGR3bmJyZnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTUzOTYsImV4cCI6MjA5NTU3MTM5Nn0.1nSVI1QpN9iEYiJsbFEj9r1Tx80qnvuIvh8yBFM3RdA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =============================================
// CONFIG CLOUDINARY — PHASE 3 (Photos)
// =============================================
const CLOUDINARY_CLOUD_NAME = 'dhnae7dnu';
const CLOUDINARY_UPLOAD_PRESET = 'efgmacqq';
const CLOUDINARY_CONFIGURED = CLOUDINARY_CLOUD_NAME !== 'TON_CLOUD_NAME' && CLOUDINARY_UPLOAD_PRESET !== 'TON_UPLOAD_PRESET';

const ASSET_TYPES = [
  'Multifamilial', 'RPA (résidence aînés)', 'Hôtellerie', 'Commercial', 'Industriel', 'Terrain', 'Mixte', 'Autre'
];

const DOC_TYPES = [
  'Listing original', 'États financiers', 'Rent roll', 'Baux', 'Rôle municipal', 'Évaluation', 'Inspection', 'Photos', 'Plans', 'Pro forma', 'Autre'
];

function uid(len = 6) {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

// ============ DATA LAYER (Supabase) ============

async function getDeals() {
  const { data, error } = await sb.from('deals').select('*').order('created_at', { ascending: false });
  if (error) { console.error('getDeals:', error); return []; }
  return data.map(row => ({ ...row.data, id: row.id, _createdAt: row.created_at }));
}

async function getDealById(id) {
  const { data, error } = await sb.from('deals').select('*').eq('id', id).maybeSingle();
  if (error || !data) return null;
  return { ...data.data, id: data.id, _createdAt: data.created_at };
}

async function saveDeal(deal) {
  // Strip internal fields before saving
  const toSave = { ...deal };
  delete toSave._createdAt;
  delete toSave.step;
  const { error } = await sb.from('deals').upsert({ id: deal.id, data: toSave });
  if (error) { console.error('saveDeal:', error); throw error; }
  return true;
}

async function deleteDealRemote(dealId) {
  const { error } = await sb.from('deals').delete().eq('id', dealId);
  if (error) { console.error('deleteDeal:', error); throw error; }
  return true;
}

async function getSignatures(dealId) {
  const { data, error } = await sb.from('signatures').select('*').eq('deal_id', dealId).order('signed_at', { ascending: false });
  if (error) { console.error('getSignatures:', error); return []; }
  return data.map(row => ({
    fullName: row.full_name,
    org: row.org,
    email: row.email,
    phone: row.phone,
    signatureData: row.signature_data,
    signedAt: row.signed_at,
    userAgent: row.user_agent
  }));
}

async function saveSignature(dealId, sig) {
  const { error } = await sb.from('signatures').insert({
    deal_id: dealId,
    full_name: sig.fullName,
    org: sig.org || null,
    email: sig.email,
    phone: sig.phone || null,
    signature_data: sig.signatureData,
    user_agent: sig.userAgent || null
  });
  if (error) { console.error('saveSignature:', error); throw error; }

}

function fmtMoney(n) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  const num = Number(n);
  return new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 }).format(num);
}

function fmtMoneyShort(n) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  const num = Number(n);
  if (num >= 1e6) return (num / 1e6).toFixed(num >= 10e6 ? 1 : 2) + ' M$';
  if (num >= 1e3) return (num / 1e3).toFixed(0) + ' k$';
  return num + ' $';
}

function fmtPct(n, decimals = 2) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return Number(n).toFixed(decimals) + ' %';
}

function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('fr-CA', { day: 'numeric', month: 'long', year: 'numeric' }); }
  catch (e) { return d; }
}

function fmtNumber(n) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return new Intl.NumberFormat('fr-CA').format(Number(n));
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function encodeDeal(deal) {
  try {
    const json = JSON.stringify(deal);
    return btoa(unescape(encodeURIComponent(json)));
  } catch (e) { return null; }
}

function decodeDeal(str) {
  try {
    const json = decodeURIComponent(escape(atob(str)));
    return JSON.parse(json);
  } catch (e) { return null; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn) {
      const old = btn.textContent;
      btn.textContent = 'Copié ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1800);
    }
    showToast('Lien copié dans le presse-papier');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Lien copié');
  });
}

async function route() {
  const hash = window.location.hash || '#/';
  const app = document.getElementById('app');
  document.body.classList.remove('dark-mode');

  if (hash === '#/' || hash === '') {
    renderLanding(app);
  } else if (hash.startsWith('#/admin')) {
    document.body.classList.add('dark-mode');
    const authed = await isAdmin();
    if (!authed) renderLogin(app);
    else await renderAdmin(app);
  } else if (hash.startsWith('#/deal/')) {
    await renderDealPage(app);
  } else {
    renderLanding(app);
  }
  window.scrollTo(0, 0);
}

          ${steps.map((_, i) => `<span class="${i < s ? 'done' : i === s ? 'active' : ''}"></span>`).join('')}
        </div>
        <div class="step-intro">
          <div class="eyebrow">${step.title}</div>
          <p>${step.sub}</p>
        </div>
        ${body}
      </div>
      ${s < 6 ? `
        <div class="modal-foot">
          ${s > 0 ? `<button class="btn btn-ghost" onclick="wizardBack()">← Précédent</button>` : `<div></div>`}
          <button class="btn btn-primary" onclick="wizardNext()">${s === 5 ? 'Générer le lien' : 'Continuer'} ${icons.arrow}</button>
        </div>
      ` : `
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeWizard();">Retour au dashboard</button>
          <button class="btn btn-primary" onclick="openWizard()">${icons.plus} Créer un autre deal</button>
        </div>
      `}
    </div>
  `;

  document.body.appendChild(backdrop);
  // Bind inputs
  bindWizardInputs(backdrop);
}

function bindWizardInputs(scope) {
  scope.querySelectorAll('[data-bind]').forEach(el => {
    const key = el.dataset.bind;
    el.addEventListener('input', () => {
      wizardState[key] = el.value;
      // Auto-calculate NOI and cap rate when relevant
      if (['grossIncome', 'expenses', 'priceCession', 'priceAsk'].includes(key)) {
        const gi = Number(wizardState.grossIncome) || 0;
        const ex = Number(wizardState.expenses) || 0;
        // Cap rate basé sur prix de cession (ce que le prospect paie réellement)
        // Fallback sur priceAsk si pas encore de prix de cession
        const px = Number(wizardState.priceCession) || Number(wizardState.priceAsk) || 0;
        if (gi && ex) {
          wizardState.noi = gi - ex;
          const noiEl = scope.querySelector('[data-bind="noi"]');
          if (noiEl) noiEl.value = wizardState.noi;
        }
        if (wizardState.noi && px) {
          wizardState.capRate = ((wizardState.noi / px) * 100).toFixed(2);
          const capEl = scope.querySelector('[data-bind="capRate"]');
          if (capEl) capEl.value = wizardState.capRate;
        }
      }
      // Compute markup if both prices set
      if (['priceAsk', 'priceCession'].includes(key)) {
        const ask = Number(wizardState.priceAsk) || 0;
        const cess = Number(wizardState.priceCession) || 0;
        if (ask && cess && cess > ask) {
          wizardState.cessionFee = cess - ask;
          const feeEl = scope.querySelector('[data-bind="cessionFee"]');
          if (feeEl) feeEl.value = wizardState.cessionFee;
        }
      }
    });
  });
}

      }
    }
  }, (error, result) => {
    if (error) {
      console.error('Cloudinary doc upload error:', error);
      showToast('Erreur d\'upload: ' + (error.statusText || 'voir console'));
      return;
    }
    if (result && result.event === 'success') {
      if (!wizardState.documents) wizardState.documents = [];
      // Derive a sensible default name from the file
      const originalFilename = result.info.original_filename || 'document';
      const format = (result.info.format || '').toLowerCase();
      const friendlyName = humanizeDocName(originalFilename);
      wizardState.documents.push({
        name: friendlyName,
        url: result.info.secure_url,
        publicId: result.info.public_id,
        format: format,
        bytes: result.info.bytes,
        uploadedAt: Date.now()
      });
      renderWizard();
    }
  });
  widget.open();

function humanizeDocName(filename) {
  // Strip extension, replace underscores/hyphens with spaces, title case
  const base = filename.replace(/\.[^.]+$/, '');
  const spaced = base.replace(/[_-]+/g, ' ').trim();
  return spaced.charAt(0).toUpperCase() + spaced.slice(1);
}

function fmtBytes(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' o';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' Ko';
  return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
}

function removeDocument(idx) {
  if (!wizardState.documents) return;
  wizardState.documents.splice(idx, 1);
  renderWizard();
}

function updateDocName(idx, value) {
  if (!wizardState.documents || !wizardState.documents[idx]) return;
  // Handle backward compat: if doc is still a string, convert it
  if (typeof wizardState.documents[idx] === 'string') {
    wizardState.documents[idx] = { name: value };
  } else {
    wizardState.documents[idx].name = value;
  }
}

function addPhotoByUrl() {
  const input = document.getElementById('photoUrlInput');
  if (!input) return;
  const url = input.value.trim();
  if (!url) { showToast('Colle un lien d\'image.'); return; }
  if (!/^https?:\/\//i.test(url)) { showToast('Le lien doit commencer par https://'); return; }
  if (!wizardState.photos) wizardState.photos = [];
  wizardState.photos.push({ url, publicId: null });
  input.value = '';
  renderWizard();
}

function removePhoto(idx) {
  if (!wizardState.photos) return;
  wizardState.photos.splice(idx, 1);
  // Adjust cover index if needed
  if (wizardState.coverIndex >= wizardState.photos.length) {
    wizardState.coverIndex = Math.max(0, wizardState.photos.length - 1);
  } else if (idx < wizardState.coverIndex) {
    wizardState.coverIndex--;
  }
  renderWizard();
}

  wizardState.coverIndex = idx;
  renderWizard();

async function wizardNext() {
  // Validate current step
  if (wizardState.step === 0) {
    if (!wizardState.title || !wizardState.assetType || !wizardState.city) {
      showToast('Remplis le titre, le type et la ville pour continuer.');
      return;
    }
  }
  if (wizardState.step === 2) {
    if (!wizardState.priceCession) {
      showToast('Le prix de cession est requis.');
      return;
    }
  }
  if (wizardState.step === 3) {
    if (!wizardState.strategy) {
      showToast('La thèse d\'investissement est requise.');
      return;
    }
  }
  // Step 4 is now Photos — optional, no validation
  if (wizardState.step === 5) {
    if (!wizardState.contactName) {
      showToast('Le nom du contact est requis.');
      return;
    }
    // Save deal to Supabase
    try {
      showToast('Sauvegarde en cours...');
      await saveDeal(wizardState);
    } catch (e) {
      showToast('Erreur de sauvegarde: ' + (e.message || 'réessaie'));
      return;
    }
  }
  wizardState.step++;
  renderWizard();
}

function wizardBack() {
  if (wizardState.step > 0) {
    wizardState.step--;
    renderWizard();
  }
}

function downloadQR(url, dealId) {
  // Use Google Charts API for simple QR (works without dependencies)
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(url)}&format=png&margin=10`;
  window.open(qrUrl, '_blank');
}

async function exportSignaturesCSV(dealId) {
  const [deal, sigs] = await Promise.all([getDealById(dealId), getSignatures(dealId)]);
  if (!deal || !sigs) { showToast('Erreur de chargement'); return; }
  const header = 'Nom,Organisation,Courriel,Téléphone,Date signature,Deal\n';
  const rows = sigs.map(s => [
    s.fullName, s.org || '', s.email, s.phone || '',
    new Date(s.signedAt).toISOString(), deal.title
  ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const csv = header + rows;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `signatures_${dealId}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

  let deal = null;

  if (encoded) deal = decodeDeal(encoded);

let sigPadCtx = null;
let sigPadDrawing = false;
let sigPadHasInk = false;
let sigPadLastX = 0;
let sigPadLastY = 0;

function setupSignaturePad() {
  const canvas = document.getElementById('sigPad');
  if (!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  sigPadCtx = canvas.getContext('2d');
  sigPadCtx.scale(ratio, ratio);
  sigPadCtx.strokeStyle = '#0E0C08';
  sigPadCtx.lineWidth = 2;
  sigPadCtx.lineCap = 'round';
  sigPadCtx.lineJoin = 'round';
  sigPadHasInk = false;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x, y };
  }
  function start(e) {
    e.preventDefault();
    sigPadDrawing = true;
    sigPadHasInk = true;
    const p = pos(e);
    sigPadLastX = p.x; sigPadLastY = p.y;
  }
  function move(e) {
    if (!sigPadDrawing) return;
    e.preventDefault();
    const p = pos(e);
    sigPadCtx.beginPath();
    sigPadCtx.moveTo(sigPadLastX, sigPadLastY);
    sigPadCtx.lineTo(p.x, p.y);
    sigPadCtx.stroke();
    sigPadLastX = p.x; sigPadLastY = p.y;
  }
  function end() { sigPadDrawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start);
  canvas.addEventListener('touchmove', move);
  canvas.addEventListener('touchend', end);
}

function clearSignaturePad() {
  const canvas = document.getElementById('sigPad');
  if (!canvas || !sigPadCtx) return;
  sigPadCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigPadHasInk = false;
}

async function submitNDA(e, dealId) {
  e.preventDefault();
  const fullName = document.getElementById('ndaFullName').value.trim();
  const org = document.getElementById('ndaOrg').value.trim();
  const email = document.getElementById('ndaEmail').value.trim();
  const phone = document.getElementById('ndaPhone').value.trim();
  const consent = document.getElementById('ndaConsent').checked;

  if (!fullName || !email || !consent) {
    showToast('Remplis tous les champs requis.');
    return false;
  }
  if (!sigPadHasInk) {
    showToast('Signature requise — utilise la zone de signature.');
    return false;
  }

  const canvas = document.getElementById('sigPad');
  const signatureData = canvas.toDataURL('image/png');
  const dealTitle = document.querySelector('.deal-hero h1')?.textContent || dealId;

  const sig = {
    fullName,
    org,
    email,
    phone,
    signatureData,
    signedAt: Date.now(),
    userAgent: navigator.userAgent
  };

  // UI feedback
  const submitBtn = e.target.querySelector('button[type="submit"]');
  if (submitBtn) { submitBtn.textContent = 'Enregistrement...'; submitBtn.disabled = true; }

  // Save signature to Supabase (await this — it's the critical path)
  try {
    await saveSignature(dealId, sig);
  } catch (err) {
    showToast('Erreur sauvegarde — réessaie. ' + (err.message || ''));
    if (submitBtn) { submitBtn.innerHTML = 'Signer et accéder au dossier ' + icons.arrow; submitBtn.disabled = false; }
    return false;
  }

  // Mark as signed locally (avoids re-signing on refresh)
  markSignedLocally(dealId);

  // Send Formspree notification in parallel (non-blocking)
  fetch('https://formspree.io/f/xkoeopyz', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify({
      _subject: `🔔 Nouvelle signature NDA — ${dealTitle}`,
      deal_id: dealId,
      deal_title: dealTitle,
      signataire_nom: fullName,
      signataire_organisation: org || 'Non précisé',
      signataire_courriel: email,
      signataire_telephone: phone || 'Non précisé',
      date_signature: new Date().toLocaleString('fr-CA', { timeZone: 'America/Toronto' })
    })
  }).catch(err => console.log('Notification Formspree non envoyée:', err));

  showToast('Signature enregistrée — déverrouillage du dossier...');
  setTimeout(() => route(), 600);
  return false;
}

                <div class="block-head">
                  <span class="block-num">02</span>
                  <h3 class="block-title">Financiers</h3>
                </div>
                <div class="kv-grid">
                  <div class="kv-cell"><span class="k">Prix demandé</span><span class="v">${fmtMoney(deal.priceAsk)}</span></div>
                  <div class="kv-cell"><span class="k">Prix de cession</span><span class="v">${fmtMoney(deal.priceCession)}</span></div>
                  ${deal.grossIncome ? `<div class="kv-cell"><span class="k">Revenus bruts</span><span class="v">${fmtMoney(deal.grossIncome)}</span></div>` : ''}
                  ${deal.expenses ? `<div class="kv-cell"><span class="k">Dépenses</span><span class="v">${fmtMoney(deal.expenses)}</span></div>` : ''}
                  ${deal.noi ? `<div class="kv-cell"><span class="k">NOI</span><span class="v">${fmtMoney(deal.noi)}</span></div>` : ''}
                  ${deal.capRate ? `<div class="kv-cell"><span class="k">Cap rate</span><span class="v">${deal.capRate}%</span></div>` : ''}
                </div>
              </div>

              ${(deal.promiseExpiry || deal.financingNotes) ? `
                <div class="dossier-block">
                  <div class="block-head">
                    <span class="block-num">03</span>
                    <h3 class="block-title">Conditions</h3>
                  </div>
                  <div class="kv-grid">
                    ${deal.promiseExpiry ? `<div class="kv-cell"><span class="k">Échéance PA</span><span class="v">${fmtDate(deal.promiseExpiry)}</span></div>` : ''}
                    ${deal.financingNotes ? `<div class="kv-cell"><span class="k">Financement</span><span class="v">${escapeHtml(deal.financingNotes)}</span></div>` : ''}
                  </div>
                </div>
              ` : ''}

              ${(() => {
                if (!deal.documents || deal.documents.length === 0) return '';
                // Normalize: handle both old format (strings) and new (objects)
                const normalizedDocs = deal.documents
                  .map(d => {
                    if (typeof d === 'string') return d.trim() ? { name: d.trim() } : null;
                    if (d && d.name) return d;
                    return null;
                  })
                  .filter(d => d !== null);
                if (normalizedDocs.length === 0) return '';
                return `
                  <div class="dossier-block">
                    <div class="block-head">
                      <span class="block-num">04</span>
                      <h3 class="block-title">Documents disponibles</h3>
                    </div>
                    <div class="docs-listing">
                      ${normalizedDocs.map(d => {
                        const hasFile = !!d.url;
                        const format = (d.format || '').toLowerCase();
                        const iconClass = format === 'pdf' ? 'pdf-icon' :
                                          (format === 'xlsx' || format === 'xls' || format === 'csv') ? 'xlsx-icon' :
                                          (format === 'docx' || format === 'doc') ? 'docx-icon' : 'other-icon';
                        const iconLabel = format ? format.toUpperCase().slice(0, 4) : '';
                        return `
                          <div class="doc-entry ${hasFile ? 'has-file' : ''}" ${hasFile ? `onclick="window.open('${escapeHtml(d.url)}', '_blank')"` : ''}>
                            <div class="doc-name">
                              <div class="doc-icon ${hasFile ? iconClass : ''}">${iconLabel || icons.doc}</div>
                              <span>${escapeHtml(d.name)}${d.bytes ? ` <span style="color:var(--muted); font-family:var(--font-mono); font-size:11px;">· ${fmtBytes(d.bytes)}</span>` : ''}</span>
                            </div>
                            <div class="doc-status ${hasFile ? 'downloadable' : 'available'}">${hasFile ? icons.download + ' Télécharger' : 'Sur demande'}</div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                    <p style="font-size:12px; color:var(--muted); margin-top:16px;">Les documents marqués "Télécharger" sont accessibles immédiatement. Les autres sont fournis sur demande par canal sécurisé.</p>
                  </div>
                `;
              })()}
            </div>

            <aside class="dossier-side">
              <div class="contact-card">
                <div class="contact-eyebrow">Contact direct</div>
                <h3>Discutons.</h3>
                <div class="contact-name">${escapeHtml(deal.contactName || '—')}</div>
                <div class="contact-org">${escapeHtml(deal.contactOrg || '')}</div>
                <div class="contact-meta">
                  ${deal.contactEmail ? `<a href="mailto:${escapeHtml(deal.contactEmail)}?subject=${encodeURIComponent('Deal #' + deal.id + ' — ' + deal.title)}">${icons.mail} ${escapeHtml(deal.contactEmail)}</a>` : ''}
                  ${deal.contactPhone ? `<a href="tel:${escapeHtml(deal.contactPhone)}">${icons.phone} ${escapeHtml(deal.contactPhone)}</a>` : ''}
                </div>
              </div>

              <div class="side-actions no-print">
                ${deal.contactEmail ? `<a href="mailto:${escapeHtml(deal.contactEmail)}?subject=${encodeURIComponent('Deal #' + deal.id + ' — Intérêt')}&body=${encodeURIComponent('Bonjour ' + (deal.contactName || '') + ',\n\nJe suis intéressé(e) à discuter du deal #' + deal.id + ' (' + deal.title + '). Quand peut-on en parler?\n\nMerci,')}" class="btn btn-primary btn-block">${icons.mail} Marquer mon intérêt</a>` : ''}
                <button class="btn btn-secondary btn-block" onclick="window.print()">${icons.download} Télécharger le dossier (PDF)</button>
              </div>
            </aside>
          </div>
        </div>
      </section>
    </main>
    ${renderFooter()}
  `;

  // Store photos for lightbox access
  window._currentDealPhotos = photos;
}

// ============ LIGHTBOX ============
let lightboxIdx = 0;

function openLightbox(idx) {
  const photos = window._currentDealPhotos || [];
  if (!photos.length) return;
  lightboxIdx = idx;
  renderLightbox();
}

function closeLightbox() {
  const lb = document.getElementById('lightbox');
  if (lb) lb.remove();
  document.removeEventListener('keydown', lightboxKeyHandler);
}

function lightboxKeyHandler(e) {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') lightboxNext();
  if (e.key === 'ArrowLeft') lightboxPrev();
}

function lightboxNext() {
  const photos = window._currentDealPhotos || [];
  lightboxIdx = (lightboxIdx + 1) % photos.length;
  renderLightbox();
}

function lightboxPrev() {
  const photos = window._currentDealPhotos || [];
  lightboxIdx = (lightboxIdx - 1 + photos.length) % photos.length;
  renderLightbox();
}

function renderLightbox() {
  const photos = window._currentDealPhotos || [];
  if (!photos.length) return;
  const photo = photos[lightboxIdx];

  let lb = document.getElementById('lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'lightbox';
    lb.className = 'lightbox';
    lb.onclick = (e) => { if (e.target === lb) closeLightbox(); };
    document.body.appendChild(lb);
    document.addEventListener('keydown', lightboxKeyHandler);
  }

  lb.innerHTML = `
    <button class="lb-close" onclick="closeLightbox()">${icons.x}</button>
    ${photos.length > 1 ? `<button class="lb-nav prev" onclick="lightboxPrev()">←</button>` : ''}
    <img src="${escapeHtml(photo.url)}" alt="" />
    ${photos.length > 1 ? `<button class="lb-nav next" onclick="lightboxNext()">→</button>` : ''}
    ${photos.length > 1 ? `<div class="lb-counter">${lightboxIdx + 1} / ${photos.length}</div>` : ''}
  `;
}
</script>
</body>
</html>
